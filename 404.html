<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Ayush Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }
    p {
      color: #64748b;
      max-width: 420px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.4), 0 0 30px rgba(16, 185, 129, 0.2);
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.6), 0 0 45px rgba(16, 185, 129, 0.4);
    }
    .terminal-hint {
      margin-top: 3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #334155;
    }
    .terminal-hint span { color: #0ea5e9; }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back to the portfolio.</p>
  <a href="./" class="home-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    Back to Portfolio
  </a>
  <p class="terminal-hint"><span>$</span> cd ~/portfolio &amp;&amp; ls</p>
</body>
</html>
